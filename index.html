<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Visualizador XML</title>

  <style>
    :root {
      --azul: #005ca9;
      --azul-escuro: #00467f;
      --azul-profundo: #073b66;
      --azul-claro: #eaf4fc;
      --azul-hover: #d8ecfa;
      --verde: #237a57;
      --verde-claro: #edf8f2;
      --amarelo: #9a6200;
      --amarelo-claro: #fff7e3;
      --texto: #263746;
      --texto-secundario: #536471;
      --borda: #d6e0e7;
      --borda-forte: #b9c9d4;
      --fundo: #eef3f7;
      --fundo-suave: #f6f8fa;
      --branco: #ffffff;
      --sombra: 0 8px 28px rgba(27, 59, 84, 0.08);
      --raio: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 280px;
      min-height: 100vh;
      margin: 0;
      padding: clamp(8px, 1.7vw, 28px);
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    select,
    a {
      font: inherit;
    }

    button,
    select,
    summary,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    .viewer-app {
      width: min(100%, 1580px);
      margin: 0 auto;
    }

    .viewer-header {
      position: relative;
      overflow: hidden;
      padding: clamp(20px, 3vw, 42px);
      border-radius: var(--raio) var(--raio) 0 0;
      background: linear-gradient(135deg, var(--azul-escuro), var(--azul));
      color: var(--branco);
      box-shadow: var(--sombra);
    }

    .viewer-header::after {
      position: absolute;
      right: -90px;
      bottom: -150px;
      width: 330px;
      height: 330px;
      border: 52px solid rgba(255, 255, 255, 0.07);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .viewer-heading-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .viewer-heading-copy {
      min-width: 0;
    }

    .viewer-title {
      max-width: 1050px;
      margin: 0;
      color: inherit;
      font-size: clamp(25px, 3vw, 43px);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    .viewer-subtitle {
      max-width: 1000px;
      margin: 12px 0 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: clamp(14px, 1.25vw, 18px);
    }

    .viewer-logos {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: flex-end;
      gap: 44px;
      max-width: 100%;
    }

    .logo-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      background: transparent;
    }

    .logo-slot.logo-capacibasis {
      width: 135px;
      height: 56px;
    }

    .logo-slot.logo-vertical {
      width: 38px;
      height: 56px;
    }

    .logo-slot.logo-horizontal {
      width: 193px;
      height: 56px;
    }

    .viewer-logo {
      display: block;
      width: 100%;
      height: 100%;
    }

    .viewer-toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: clamp(14px, 1.8vw, 22px);
      border-right: 1px solid var(--borda);
      border-bottom: 1px solid var(--borda);
      border-left: 1px solid var(--borda);
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 7px 18px rgba(27, 59, 84, 0.08);
      backdrop-filter: blur(8px);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: minmax(250px, 1.6fr) repeat(3, minmax(170px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .field {
      min-width: 0;
    }

    .field label {
      display: block;
      margin: 0 0 5px;
      color: var(--texto);
      font-size: 12px;
      font-weight: 800;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--borda-forte);
      border-radius: 8px;
      padding: 9px 11px;
      background: var(--branco);
      color: var(--texto);
      outline: none;
    }

    .search-control {
      position: relative;
    }

    .search-control input {
      padding-left: 42px;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--azul);
      pointer-events: none;
      transform: translateY(-50%);
    }

    .search-icon path {
      fill: currentColor;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(0, 92, 169, 0.14);
    }

    .toolbar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 13px;
    }

    .result-summary {
      margin: 0;
      color: var(--texto-secundario);
      font-size: 14px;
    }

    .result-summary strong {
      color: var(--azul-escuro);
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .tool-button {
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--azul);
      border-radius: 7px;
      background: var(--branco);
      color: var(--azul);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .tool-button:hover:not(:disabled) {
      background: var(--azul-claro);
    }

    .tool-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .viewer-content {
      padding: clamp(14px, 2vw, 28px);
      border-right: 1px solid var(--borda);
      border-bottom: 1px solid var(--borda);
      border-left: 1px solid var(--borda);
      border-radius: 0 0 var(--raio) var(--raio);
      background: var(--branco);
      box-shadow: var(--sombra);
    }

    .root-extra,
    .generic-panel {
      margin: 0 0 18px;
      padding: 14px 16px;
      border: 1px solid var(--borda);
      border-radius: 9px;
      background: var(--fundo-suave);
    }

    .root-extra h2,
    .generic-panel h6 {
      margin: 0 0 9px;
      color: var(--azul-escuro);
    }

    .quadro-block {
      margin: 0 0 28px;
      border: 1px solid var(--borda);
      border-radius: 12px;
      background: var(--branco);
      box-shadow: 0 5px 18px rgba(27, 59, 84, 0.07);
    }

    .quadro-block:last-child {
      margin-bottom: 0;
    }

    .quadro-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: clamp(16px, 2vw, 24px);
      border-radius: 11px 11px 0 0;
      background: linear-gradient(135deg, #f0f7fd, #ffffff);
      border-bottom: 1px solid var(--borda);
    }

    .quadro-heading {
      min-width: 0;
    }

    .section-kicker {
      margin: 0 0 4px;
      color: var(--azul);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .quadro-title {
      margin: 0;
      color: var(--azul-profundo);
      font-size: clamp(19px, 1.8vw, 26px);
      line-height: 1.22;
      overflow-wrap: anywhere;
    }

    .status-chip {
      flex: 0 0 auto;
      max-width: 280px;
      padding: 6px 10px;
      border: 1px solid #c7dded;
      border-radius: 999px;
      background: var(--branco);
      color: var(--azul-escuro);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .quadro-body {
      padding: clamp(14px, 2vw, 24px);
    }

    .general-block + .general-block {
      margin-top: 26px;
    }

    .general-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 13px 15px;
      border-left: 6px solid var(--azul);
      border-radius: 8px;
      background: var(--azul-claro);
    }

    .code-pill {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      min-width: 46px;
      min-height: 30px;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--azul);
      color: var(--branco);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .general-title {
      margin: 0;
      color: var(--azul-escuro);
      font-size: clamp(18px, 1.6vw, 23px);
      line-height: 1.25;
    }

    .specific-block {
      margin: 0 0 24px;
      padding-left: clamp(0px, 1vw, 14px);
    }

    .specific-block:last-child {
      margin-bottom: 0;
    }

    .specific-header {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin: 0 0 13px;
      padding-bottom: 8px;
      border-bottom: 2px solid #dbeaf4;
    }

    .specific-code,
    .detailed-code {
      flex: 0 0 auto;
      color: var(--azul);
      font-size: 12px;
      font-weight: 800;
    }

    .specific-title {
      margin: 0;
      color: var(--texto);
      font-size: clamp(17px, 1.35vw, 21px);
      line-height: 1.3;
    }

    .detailed-block {
      margin: 0 0 20px;
      padding: clamp(12px, 1.4vw, 18px);
      border: 1px solid #dfe7ec;
      border-radius: 10px;
      background: #fbfcfd;
    }

    .detailed-block:last-child {
      margin-bottom: 0;
    }

    .detailed-header {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin-bottom: 12px;
    }

    .detailed-title {
      margin: 0;
      color: var(--azul-profundo);
      font-size: clamp(15px, 1.18vw, 18px);
      line-height: 1.3;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .item-card {
      min-width: 0;
      border: 1px solid var(--borda);
      border-radius: 9px;
      background: var(--branco);
      box-shadow: 0 2px 8px rgba(27, 59, 84, 0.05);
    }

    .item-card[open] {
      grid-column: 1 / -1;
      border-color: #a9cce4;
      box-shadow: 0 7px 18px rgba(0, 92, 169, 0.1);
    }

    .item-summary {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 66px;
      padding: 11px 42px 11px 12px;
      border-radius: 8px;
      cursor: pointer;
      list-style: none;
    }

    .item-summary::-webkit-details-marker {
      display: none;
    }

    .item-summary::after {
      position: absolute;
      right: 16px;
      top: 50%;
      width: 9px;
      height: 9px;
      border-right: 2px solid var(--azul);
      border-bottom: 2px solid var(--azul);
      content: "";
      transform: translateY(-68%) rotate(45deg);
      transition: transform 0.18s ease;
    }

    .item-card[open] > .item-summary::after {
      transform: translateY(-28%) rotate(225deg);
    }

    .item-summary:hover {
      background: var(--azul-claro);
    }

    .item-name {
      min-width: 0;
      color: var(--texto);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .item-badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
    }

    .count-badge {
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--fundo-suave);
      color: var(--texto-secundario);
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .observation-badge {
      border: 1px solid #d5c0e8;
      background: #f5eefb;
      color: #684080;
    }

    .item-content {
      padding: 0 13px 14px;
      border-top: 1px solid #e5ebef;
    }

    .reference-group {
      margin-top: 13px;
      padding: 12px 13px;
      border-left: 4px solid var(--azul);
      border-radius: 7px;
      background: var(--azul-claro);
    }

    .reference-group.cncst {
      border-left-color: var(--verde);
      background: var(--verde-claro);
    }

    .reference-group.outros {
      border-left-color: var(--amarelo);
      background: var(--amarelo-claro);
    }

    .reference-title {
      margin: 0 0 8px;
      color: var(--azul-escuro);
      font-size: 14px;
      font-weight: 800;
    }

    .reference-group.cncst .reference-title {
      color: #17583e;
    }

    .reference-group.outros .reference-title {
      color: #704900;
    }

    .reference-text {
      margin: 8px 0;
      padding: 9px 11px;
      border-radius: 6px;
      background: var(--branco);
      color: var(--texto);
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .reference-text + .reference-text {
      margin-top: 6px;
    }

    .empty-reference {
      margin: 7px 0;
      color: var(--texto-secundario);
      font-size: 12px;
      font-style: italic;
      line-height: 1.45;
      opacity: 0.72;
      overflow-wrap: anywhere;
    }

    .link-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      padding: 10px 11px;
      border: 1px solid rgba(83, 100, 113, 0.19);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.86);
    }

    .link-entry-title {
      min-width: 0;
      color: var(--texto);
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .link-entry-copy {
      flex: 1 1 auto;
      min-width: 0;
    }

    .link-observations {
      margin-top: 8px;
      padding: 8px 10px;
      border-left: 3px solid #8256a3;
      border-radius: 5px;
      background: #f7f1fb;
      color: #5f3c77;
    }

    .link-observation {
      margin: 0;
      font-size: 12px;
      font-style: italic;
      font-weight: 400;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .link-observation + .link-observation {
      margin-top: 6px;
    }

    .access-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid var(--azul);
      border-radius: 6px;
      background: var(--azul);
      color: var(--branco);
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .access-button:hover {
      border-color: var(--azul-escuro);
      background: var(--azul-escuro);
    }

    .invalid-url {
      display: block;
      margin-top: 5px;
      color: #8b2f2f;
      font-size: 11px;
      font-weight: 400;
      overflow-wrap: anywhere;
    }

    .generic-field {
      margin-top: 8px;
      padding: 9px 10px;
      border: 1px dashed var(--borda-forte);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--texto-secundario);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .generic-field > strong {
      display: block;
      margin-bottom: 3px;
      color: var(--texto);
    }

    .generic-children {
      margin-left: 8px;
      padding-left: 9px;
      border-left: 2px solid var(--borda);
    }

    .empty-results {
      padding: 34px 20px;
      border: 1px dashed var(--borda-forte);
      border-radius: 10px;
      background: var(--fundo-suave);
      color: var(--texto-secundario);
      text-align: center;
    }

    .load-status {
      width: min(100%, 900px);
      margin: 12vh auto 0;
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid var(--borda);
      border-radius: var(--raio);
      background: var(--branco);
      box-shadow: var(--sombra);
      text-align: center;
    }

    .load-status h1 {
      margin: 0 0 10px;
      color: var(--azul-escuro);
      font-size: clamp(23px, 3vw, 34px);
    }

    .load-status p {
      margin: 8px auto;
      color: var(--texto-secundario);
      overflow-wrap: anywhere;
    }

    .load-status .tool-button {
      margin-top: 14px;
    }

    .back-to-top {
      position: fixed;
      right: clamp(12px, 2vw, 28px);
      bottom: clamp(12px, 2vw, 28px);
      z-index: 40;
      width: 44px;
      height: 44px;
      border: 1px solid var(--azul);
      border-radius: 50%;
      background: var(--azul);
      color: var(--branco);
      font-size: 21px;
      font-weight: 800;
      box-shadow: 0 5px 16px rgba(0, 70, 127, 0.25);
      cursor: pointer;
    }

    .back-to-top:hover {
      background: var(--azul-escuro);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    summary:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(0, 92, 169, 0.25);
      outline-offset: 2px;
    }

    @media (min-width: 1500px) {
      .items-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 1050px) {
      .filter-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 6px;
      }

      .viewer-heading-row,
      .quadro-header,
      .toolbar-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .viewer-toolbar {
        position: static;
      }

      .viewer-logos {
        justify-content: flex-start;
        width: 100%;
        gap: min(16px, 4vw);
      }

      .logo-slot.logo-capacibasis {
        width: min(87px, 26.5vw);
        height: min(36px, 11vw);
      }

      .logo-slot.logo-vertical {
        width: min(24px, 7.5vw);
        height: min(36px, 11vw);
      }

      .logo-slot.logo-horizontal {
        width: min(124px, 38vw);
        height: min(36px, 11vw);
      }

      .filter-grid,
      .items-grid {
        grid-template-columns: 1fr;
      }

      .toolbar-actions {
        justify-content: flex-start;
      }

      .item-card[open] {
        grid-column: auto;
      }

      .status-chip {
        align-self: flex-start;
      }
    }

    @media (max-width: 520px) {
      .viewer-header,
      .viewer-toolbar,
      .viewer-content {
        padding: 12px;
      }

      .item-summary {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .item-badges {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }

      .link-entry {
        align-items: stretch;
        flex-direction: column;
      }

      .access-button {
        width: 100%;
      }

      .tool-button {
        flex: 1 1 auto;
      }
    }

    @media print {
      body {
        padding: 0;
        background: var(--branco);
      }

      .viewer-header {
        border-radius: 0;
        box-shadow: none;
      }

      .viewer-toolbar,
      .back-to-top,
      .access-button {
        display: none !important;
      }

      .viewer-content,
      .quadro-block,
      .item-card {
        box-shadow: none;
      }

      .item-card {
        break-inside: avoid;
      }

      .link-entry::after {
        display: block;
        color: var(--texto-secundario);
        content: attr(data-url);
        font-size: 9pt;
        overflow-wrap: anywhere;
      }
    }
  </style>
</head>

<body>
  <main class="viewer-app" id="viewerApp" aria-live="polite">
    <section class="load-status" id="initialStatus">
      <h1>Carregando dados...</h1>
      <p>Aguarde enquanto o arquivo XML é processado.</p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const CONFIG = {
        arquivoXml: "quadro.xml",
        logos: [
          {
            classe: "logo-capacibasis",
            textoAlternativo: "CapaciBasis",
            viewBox: "0 0 665 281",
            tipo: "imagem",

      const app = document.getElementById("viewerApp");

      const TAG_LABELS = {
        quadro_referencia: "Quadro de referência",
        arquivo_origem: "Arquivo de origem",
        data_conversao: "Data de conversão",
        total_quadros: "Total de quadros",
        area_geral: "Área geral",
        area_especifica: "Área específica",
        area_detalhada: "Área detalhada",
        rotulo_cine: "Rótulo CINE",
        dcn: "DCN",
        cncst: "CNCST",
        outros: "Outros documentos"
      };

      let records = [];
      let hierarchy = {
        frames: [],
        generals: [],
        specifics: [],
        detailed: []
      };
      let refs = {};
      let itemsExpanded = false;
      let searchTimer = null;

      function normalizeWhitespace(value) {
        return String(value || "").replace(/\s+/g, " ").trim();
      }

      function normalizeForSearch(value) {
        return normalizeWhitespace(value)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLocaleLowerCase("pt-BR");
      }

      function humanizeTag(tagName) {
        if (TAG_LABELS[tagName]) {
          return TAG_LABELS[tagName];
        }

        const text = String(tagName || "")
          .replace(/[_-]+/g, " ")
          .replace(/([a-z])([A-Z])/g, "$1 $2")
          .trim();

        return text ? text.charAt(0).toLocaleUpperCase("pt-BR") + text.slice(1) : "Informação";
      }

      function directChildren(node, tagName) {
        return Array.from(node ? node.children : []).filter(function (child) {
          return !tagName || child.localName === tagName;
        });
      }

      function directChild(node, tagName) {
        return directChildren(node, tagName)[0] || null;
      }

      function directText(node, tagName) {
        const child = directChild(node, tagName);
        return child ? normalizeWhitespace(child.textContent) : "";
      }

      function createElement(tagName, className, text) {
        const element = document.createElement(tagName);
        if (className) {
          element.className = className;
        }
        if (text !== undefined && text !== null) {
          element.textContent = text;
        }
        return element;
      }

      function parseXml(xmlText) {
        const parser = new DOMParser();
        const documentXml = parser.parseFromString(xmlText, "application/xml");
        const parserError = documentXml.querySelector("parsererror");

        if (parserError) {
          throw new Error("O arquivo selecionado não contém um XML válido.");
        }

        if (!documentXml.documentElement) {
          throw new Error("O arquivo XML não possui um elemento raiz.");
        }

        return documentXml;
      }

      function validHttpUrl(value) {
        const candidate = normalizeWhitespace(value);
        if (!candidate) return "";

        try {
          const parsed = new URL(candidate);
          return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : "";
        } catch (error) {
          return "";
        }
      }

      function getRequestedXmlPath() {
        const query = new URLSearchParams(window.location.search);
        return normalizeWhitespace(query.get("xml")) || CONFIG.arquivoXml;
      }

      async function fetchXml() {
        const xmlPath = getRequestedXmlPath();
        const response = await fetch(xmlPath, {
          cache: "no-store",
          credentials: "same-origin"
        });

        if (!response.ok) {
          throw new Error(
            "Não foi possível abrir o XML \"" + xmlPath + "\" (HTTP " + response.status + ")."
          );
        }

        return response.text();
      }

      function deriveToolTitle(root) {
        const metadata = directChild(root, "metadados");
        return directText(metadata, "titulo") || humanizeTag(root.localName);
      }

      function collectSearchText(node) {
        const values = [];

        function walk(current) {
          Array.from(current.childNodes).forEach(function (child) {
            if (child.nodeType === Node.TEXT_NODE) {
              const value = normalizeWhitespace(child.nodeValue);
              if (value) {
                values.push(value);
              }
              return;
            }

            if (child.nodeType !== Node.ELEMENT_NODE) {
              return;
            }

            if (child.localName === "codigo" && child.parentElement && child.parentElement.localName === "link") {
              return;
            }

            walk(child);
          });
        }

        walk(node);
        return values.join(" ");
      }

      function buildGenericField(xmlNode) {
        const value = normalizeWhitespace(xmlNode.textContent);
        const attributes = Array.from(xmlNode.attributes || []);
        if (!value && attributes.length === 0) {
          return null;
        }

        const wrapper = createElement("div", "generic-field");
        wrapper.appendChild(createElement("strong", "", humanizeTag(xmlNode.localName)));

        attributes.forEach(function (attribute) {
          const attributeLine = createElement("div", "");
          attributeLine.textContent = humanizeTag(attribute.name) + ": " + attribute.value;
          wrapper.appendChild(attributeLine);
        });

        const children = directChildren(xmlNode);
        if (children.length === 0) {
          if (value) {
            wrapper.appendChild(document.createTextNode(value));
          }
          return wrapper;
        }

        const ownText = normalizeWhitespace(
          Array.from(xmlNode.childNodes)
            .filter(function (child) { return child.nodeType === Node.TEXT_NODE; })
            .map(function (child) { return child.nodeValue; })
            .join(" ")
        );
        if (ownText) {
          wrapper.appendChild(createElement("div", "", ownText));
        }

        const childWrapper = createElement("div", "generic-children");
        children.forEach(function (child) {
          const field = buildGenericField(child);
          if (field) {
            childWrapper.appendChild(field);
          }
        });

        if (childWrapper.childElementCount > 0) {
          wrapper.appendChild(childWrapper);
        } else {
          wrapper.appendChild(document.createTextNode(value));
        }

        return wrapper;
      }

      function appendUnknownChildren(xmlNode, handledTags, htmlParent) {
        const attributes = Array.from(xmlNode.attributes || []);
        const ownText = normalizeWhitespace(
          Array.from(xmlNode.childNodes)
            .filter(function (child) { return child.nodeType === Node.TEXT_NODE; })
            .map(function (child) { return child.nodeValue; })
            .join(" ")
        );

        if (attributes.length || ownText) {
          const extra = createElement("div", "generic-field");
          extra.appendChild(createElement("strong", "", "Informação adicional"));
          attributes.forEach(function (attribute) {
            extra.appendChild(createElement(
              "div",
              "",
              humanizeTag(attribute.name) + ": " + attribute.value
            ));
          });
          if (ownText) {
            extra.appendChild(createElement("div", "", ownText));
          }
          htmlParent.appendChild(extra);
        }

        directChildren(xmlNode).forEach(function (child) {
          if (handledTags.has(child.localName)) {
            return;
          }

          const field = buildGenericField(child);
          if (field) {
            htmlParent.appendChild(field);
          }
        });
      }

      function renderLink(linkXml) {
        const wrapper = createElement("div", "link-entry");
        const copy = createElement("div", "link-entry-copy");
        const title = directText(linkXml, "titulo") || "Documento de referência";
        const urlValue = directText(linkXml, "url");
        const safeUrl = validHttpUrl(urlValue);
        const titleWrapper = createElement("div", "link-entry-title", title);
        const observations = directChildren(linkXml, "texto")
          .map(function (node) { return normalizeWhitespace(node.textContent); })
          .filter(Boolean);

        copy.appendChild(titleWrapper);

        if (observations.length) {
          const observationWrapper = createElement("div", "link-observations");
          observations.forEach(function (observation) {
            observationWrapper.appendChild(createElement("p", "link-observation", observation));
          });
          copy.appendChild(observationWrapper);
        }

        appendUnknownChildren(linkXml, new Set(["codigo", "titulo", "url", "texto"]), copy);
        wrapper.appendChild(copy);

        if (safeUrl) {
          const anchor = createElement("a", "access-button", "Acessar ↗");
          anchor.href = safeUrl;
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
          anchor.setAttribute("aria-label", "Acessar: " + title);
          wrapper.dataset.url = safeUrl;
          wrapper.appendChild(anchor);
        } else {
          const invalid = createElement(
            "span",
            "invalid-url",
            urlValue ? "Endereço informado: " + urlValue : "Link não disponível"
          );
          copy.appendChild(invalid);
          wrapper.dataset.url = urlValue;
        }

        return wrapper;
      }

      function renderReferenceGroup(groupXml) {
        const groupName = groupXml.localName;
        const wrapper = createElement("section", "reference-group " + groupName);
        const groupTitle = directText(groupXml, "titulo") || humanizeTag(groupName);
        wrapper.appendChild(createElement("h6", "reference-title", groupTitle));

        let contentCount = 0;
        directChildren(groupXml).forEach(function (child) {
          if (child.localName === "titulo") {
            return;
          }

          if (child.localName === "texto") {
            const value = normalizeWhitespace(child.textContent);
            if (value) {
              wrapper.appendChild(createElement("p", "reference-text", value));
              contentCount += 1;
            }
            return;
          }

          if (child.localName === "link") {
            wrapper.appendChild(renderLink(child));
            contentCount += 1;
            return;
          }

          const field = buildGenericField(child);
          if (field) {
            wrapper.appendChild(field);
            contentCount += 1;
          }
        });

        if (contentCount === 0) {
          wrapper.appendChild(createElement("p", "empty-reference", "Sem informações registradas neste grupo."));
        }

        return wrapper;
      }

      function makeCountBadge(label, count) {
        return createElement("span", "count-badge", count + " " + label);
      }

      function hasLinkObservations(groupXml) {
        return Boolean(groupXml) && directChildren(groupXml, "link").some(function (linkXml) {
          return directChildren(linkXml, "texto").some(function (textXml) {
            return Boolean(normalizeWhitespace(textXml.textContent));
          });
        });
      }

      function hasStandaloneObservation(groupXml) {
        if (!groupXml || directChildren(groupXml, "link").length > 0) {
          return false;
        }

        return directChildren(groupXml, "texto").some(function (textXml) {
          return Boolean(normalizeWhitespace(textXml.textContent));
        });
      }

      function renderItem(itemXml, context) {
        const card = createElement("details", "item-card");
        const summary = createElement("summary", "item-summary");
        const cine = directChild(itemXml, "rotulo_cine");
        const itemCode = directText(cine, "codigo");
        const itemTitle = directText(cine, "titulo") || "Item sem título";
        const codePill = createElement("span", "code-pill", itemCode || "Item");
        const name = createElement("span", "item-name", itemTitle);
        const badges = createElement("span", "item-badges");

        const dcn = directChild(itemXml, "dcn");
        const cncst = directChild(itemXml, "cncst");
        const outros = directChild(itemXml, "outros");
        const dcnCount = dcn ? directChildren(dcn, "link").length : 0;
        const cncstCount = cncst ? directChildren(cncst, "link").length : 0;
        const outrosCount = outros ? directChildren(outros, "link").length : 0;
        const hasObservations = [dcn, cncst, outros].some(hasLinkObservations);
        const hasStandaloneObservationBadge = [dcn, cncst, outros].some(hasStandaloneObservation);

        if (dcnCount) {
          badges.appendChild(makeCountBadge("DCN", dcnCount));
        }
        if (cncstCount) {
          badges.appendChild(makeCountBadge("CNCST", cncstCount));
        }
        if (outrosCount) {
          badges.appendChild(makeCountBadge("outros", outrosCount));
        }
        if (!dcnCount && !cncstCount && !outrosCount) {
          badges.appendChild(makeCountBadge("links", 0));
        }
        if (hasObservations) {
          badges.appendChild(createElement("span", "count-badge observation-badge", "Observações"));
        }
        if (hasStandaloneObservationBadge) {
          badges.appendChild(createElement("span", "count-badge observation-badge", "Observação"));
        }

        summary.appendChild(codePill);
        summary.appendChild(name);
        summary.appendChild(badges);
        card.appendChild(summary);

        const content = createElement("div", "item-content");
        if (cine) {
          appendUnknownChildren(cine, new Set(["codigo", "titulo"]), content);
        }
        [dcn, cncst, outros].forEach(function (group) {
          if (group) {
            content.appendChild(renderReferenceGroup(group));
          }
        });
        appendUnknownChildren(itemXml, new Set(["rotulo_cine", "dcn", "cncst", "outros"]), content);
        card.appendChild(content);

        const searchValue = normalizeForSearch([
          context.frameCode,
          context.frameTitle,
          context.generalCode,
          context.generalTitle,
          context.specificCode,
          context.specificTitle,
          context.detailedCode,
          context.detailedTitle,
          collectSearchText(itemXml)
        ].join(" "));

        const record = {
          element: card,
          search: searchValue,
          generalKey: context.generalKey,
          generalLabel: context.generalCode + " — " + context.generalTitle,
          specificKey: context.specificKey,
          specificLabel: context.specificCode + " — " + context.specificTitle,
          detailedKey: context.detailedKey,
          detailedLabel: context.detailedCode + " — " + context.detailedTitle,
          visible: true
        };

        records.push(record);
        context.container.records.push(record);
        return card;
      }

      function renderDetailed(detailedXml, context) {
        const code = directText(detailedXml, "codigo");
        const title = directText(detailedXml, "titulo") || "Área detalhada sem título";
        const key = context.specificKey + "::" + code + "::" + title;
        const block = createElement("section", "detailed-block");
        const header = createElement("div", "detailed-header");
        header.appendChild(createElement("span", "detailed-code", code));
        header.appendChild(createElement("h5", "detailed-title", title));
        block.appendChild(header);
        appendUnknownChildren(detailedXml, new Set(["codigo", "titulo", "itens"]), block);

        const grid = createElement("div", "items-grid");
        const container = { element: block, records: [] };
        const itemsWrapper = directChild(detailedXml, "itens");
        const itemNodes = itemsWrapper ? directChildren(itemsWrapper, "item") : directChildren(detailedXml, "item");

        itemNodes.forEach(function (itemXml) {
          grid.appendChild(renderItem(itemXml, {
            frameCode: context.frameCode,
            frameTitle: context.frameTitle,
            generalCode: context.generalCode,
            generalTitle: context.generalTitle,
            generalKey: context.generalKey,
            specificCode: context.specificCode,
            specificTitle: context.specificTitle,
            specificKey: context.specificKey,
            detailedCode: code,
            detailedTitle: title,
            detailedKey: key,
            container: container
          }));
        });

        if (itemsWrapper) {
          appendUnknownChildren(itemsWrapper, new Set(["item"]), block);
        }
        block.appendChild(grid);
        hierarchy.detailed.push(container);
        return block;
      }

      function renderSpecific(specificXml, context) {
        const code = directText(specificXml, "codigo");
        const title = directText(specificXml, "titulo") || "Área específica sem título";
        const key = context.generalKey + "::" + code + "::" + title;
        const block = createElement("section", "specific-block");
        const header = createElement("div", "specific-header");
        header.appendChild(createElement("span", "specific-code", code));
        header.appendChild(createElement("h4", "specific-title", title));
        block.appendChild(header);
        appendUnknownChildren(specificXml, new Set(["codigo", "titulo", "area_detalhada"]), block);

        const container = { element: block, records: [] };
        directChildren(specificXml, "area_detalhada").forEach(function (detailedXml) {
          const before = records.length;
          block.appendChild(renderDetailed(detailedXml, {
            frameCode: context.frameCode,
            frameTitle: context.frameTitle,
            generalCode: context.generalCode,
            generalTitle: context.generalTitle,
            generalKey: context.generalKey,
            specificCode: code,
            specificTitle: title,
            specificKey: key
          }));
          container.records.push.apply(container.records, records.slice(before));
        });

        hierarchy.specifics.push(container);
        return block;
      }

      function renderGeneral(generalXml, context) {
        const code = directText(generalXml, "codigo");
        const title = directText(generalXml, "titulo") || "Área geral sem título";
        const key = context.frameCode + "::" + code + "::" + title;
        const block = createElement("section", "general-block");
        const header = createElement("div", "general-header");
        header.appendChild(createElement("span", "code-pill", code));
        header.appendChild(createElement("h3", "general-title", title));
        block.appendChild(header);
        appendUnknownChildren(generalXml, new Set(["codigo", "titulo", "area_especifica"]), block);

        const container = { element: block, records: [] };
        directChildren(generalXml, "area_especifica").forEach(function (specificXml) {
          const before = records.length;
          block.appendChild(renderSpecific(specificXml, {
            frameCode: context.frameCode,
            frameTitle: context.frameTitle,
            generalCode: code,
            generalTitle: title,
            generalKey: key
          }));
          container.records.push.apply(container.records, records.slice(before));
        });

        hierarchy.generals.push(container);
        return block;
      }

      function renderFrame(frameXml) {
        const code = directText(frameXml, "numero");
        const title = directText(frameXml, "titulo") || "Quadro " + code;
        const status = directText(frameXml, "status");
        const article = createElement("article", "quadro-block");
        const header = createElement("header", "quadro-header");
        const heading = createElement("div", "quadro-heading");
        heading.appendChild(createElement("p", "section-kicker", "Quadro " + code));
        heading.appendChild(createElement("h2", "quadro-title", title));
        header.appendChild(heading);
        if (status) {
          header.appendChild(createElement("span", "status-chip", status));
        }
        article.appendChild(header);

        const body = createElement("div", "quadro-body");
        appendUnknownChildren(frameXml, new Set(["numero", "titulo", "status", "area_geral"]), body);
        const container = { element: article, records: [] };
        directChildren(frameXml, "area_geral").forEach(function (generalXml) {
          const before = records.length;
          body.appendChild(renderGeneral(generalXml, {
            frameCode: code,
            frameTitle: title
          }));
          container.records.push.apply(container.records, records.slice(before));
        });
        article.appendChild(body);
        hierarchy.frames.push(container);
        return article;
      }

      function uniqueOptions(list, keyName, labelName) {
        const map = new Map();
        list.forEach(function (record) {
          if (!map.has(record[keyName])) {
            map.set(record[keyName], record[labelName]);
          }
        });
        return Array.from(map, function (entry) {
          return { value: entry[0], label: entry[1] };
        }).sort(function (a, b) {
          return a.label.localeCompare(b.label, "pt-BR", { numeric: true });
        });
      }

      function fillSelect(select, placeholder, options, selectedValue) {
        select.replaceChildren();
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = placeholder;
        select.appendChild(empty);

        options.forEach(function (optionData) {
          const option = document.createElement("option");
          option.value = optionData.value;
          option.textContent = optionData.label;
          select.appendChild(option);
        });

        select.value = options.some(function (option) {
          return option.value === selectedValue;
        }) ? selectedValue : "";
      }

      function rebuildDependentFilters() {
        const generalValue = refs.general.value;
        const previousSpecific = refs.specific.value;
        const specificCandidates = generalValue
          ? records.filter(function (record) { return record.generalKey === generalValue; })
          : records;

        fillSelect(
          refs.specific,
          "Todas as áreas específicas",
          uniqueOptions(specificCandidates, "specificKey", "specificLabel"),
          previousSpecific
        );

        const specificValue = refs.specific.value;
        const previousDetailed = refs.detailed.value;
        const detailedCandidates = records.filter(function (record) {
          if (specificValue) {
            return record.specificKey === specificValue;
          }
          if (generalValue) {
            return record.generalKey === generalValue;
          }
          return true;
        });

        fillSelect(
          refs.detailed,
          "Todas as áreas detalhadas",
          uniqueOptions(detailedCandidates, "detailedKey", "detailedLabel"),
          previousDetailed
        );
      }

      function toggleContainers(containers) {
        containers.forEach(function (container) {
          container.element.hidden = !container.records.some(function (record) {
            return record.visible;
          });
        });
      }

      function applyFilters() {
        const terms = normalizeForSearch(refs.search.value).split(" ").filter(Boolean);
        const generalValue = refs.general.value;
        const specificValue = refs.specific.value;
        const detailedValue = refs.detailed.value;
        let visibleCount = 0;

        records.forEach(function (record) {
          const searchMatch = terms.every(function (term) {
            return record.search.indexOf(term) !== -1;
          });
          const visible = searchMatch &&
            (!generalValue || record.generalKey === generalValue) &&
            (!specificValue || record.specificKey === specificValue) &&
            (!detailedValue || record.detailedKey === detailedValue);

          record.visible = visible;
          record.element.hidden = !visible;
          if (visible) {
            visibleCount += 1;
          }
        });

        toggleContainers(hierarchy.detailed);
        toggleContainers(hierarchy.specifics);
        toggleContainers(hierarchy.generals);
        toggleContainers(hierarchy.frames);

        refs.empty.hidden = visibleCount !== 0;
        refs.summary.innerHTML = "";
        const strong = document.createElement("strong");
        strong.textContent = String(visibleCount);
        refs.summary.appendChild(strong);
        refs.summary.appendChild(document.createTextNode(
          " de " + records.length + (records.length === 1 ? " item exibido" : " itens exibidos")
        ));

        const hasFilters = Boolean(terms.length || generalValue || specificValue || detailedValue);
        refs.clear.disabled = !hasFilters;
        refs.itemToggle.disabled = visibleCount === 0;
      }

      function clearFilters() {
        refs.search.value = "";
        refs.general.value = "";
        refs.specific.value = "";
        refs.detailed.value = "";
        rebuildDependentFilters();
        applyFilters();
        refs.search.focus();
      }

      function setAllItemsOpen(open) {
        itemsExpanded = open;
        records.forEach(function (record) {
          record.element.open = open;
        });
        refs.itemToggle.textContent = open ? "Recolher itens" : "Expandir itens";
      }

      function buildToolbar() {
        const toolbar = createElement("section", "viewer-toolbar");
        toolbar.setAttribute("aria-label", "Busca e filtros");
        const grid = createElement("div", "filter-grid");

        function makeField(labelText, control) {
          const field = createElement("div", "field");
          const label = createElement("label", "", labelText);
          label.htmlFor = control.id;
          field.appendChild(label);
          field.appendChild(control);
          return field;
        }

        function makeSearchField(labelText, control) {
          const field = createElement("div", "field");
          const label = createElement("label", "", labelText);
          const wrapper = createElement("div", "search-control");
          const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");

          label.htmlFor = control.id;
          icon.setAttribute("class", "search-icon");
          icon.setAttribute("viewBox", "0 0 118.783 118.783");
          icon.setAttribute("aria-hidden", "true");
          icon.setAttribute("focusable", "false");
          path.setAttribute("d", "M115.97,101.597L88.661,74.286c4.64-7.387,7.333-16.118,7.333-25.488c0-26.509-21.49-47.996-47.998-47.996S0,22.289,0,48.798c0,26.51,21.487,47.995,47.996,47.995c10.197,0,19.642-3.188,27.414-8.605l26.984,26.986c1.875,1.873,4.333,2.806,6.788,2.806c2.458,0,4.913-0.933,6.791-2.806C119.72,111.423,119.72,105.347,115.97,101.597zM47.996,81.243c-17.917,0-32.443-14.525-32.443-32.443s14.526-32.444,32.443-32.444c17.918,0,32.443,14.526,32.443,32.444S65.914,81.243,47.996,81.243z");

          icon.appendChild(path);
          wrapper.appendChild(icon);
          wrapper.appendChild(control);
          field.appendChild(label);
          field.appendChild(wrapper);
          return field;
        }

        const search = document.createElement("input");
        search.id = "viewerSearch";
        search.type = "search";
        search.placeholder = "Digite um curso, área ou referência...";
        search.autocomplete = "off";

        const general = document.createElement("select");
        general.id = "generalFilter";
        const specific = document.createElement("select");
        specific.id = "specificFilter";
        const detailed = document.createElement("select");
        detailed.id = "detailedFilter";

        grid.appendChild(makeSearchField("Buscar em todos os conteúdos", search));
        grid.appendChild(makeField("Área geral", general));
        grid.appendChild(makeField("Área específica", specific));
        grid.appendChild(makeField("Área detalhada", detailed));
        toolbar.appendChild(grid);

        const footer = createElement("div", "toolbar-footer");
        const summary = createElement("p", "result-summary");
        summary.setAttribute("aria-live", "polite");
        const actions = createElement("div", "toolbar-actions");
        const clear = createElement("button", "tool-button", "Limpar filtros");
        const itemToggle = createElement("button", "tool-button", "Expandir itens");
        clear.type = itemToggle.type = "button";
        actions.appendChild(clear);
        actions.appendChild(itemToggle);
        footer.appendChild(summary);
        footer.appendChild(actions);
        toolbar.appendChild(footer);

        refs.search = search;
        refs.general = general;
        refs.specific = specific;
        refs.detailed = detailed;
        refs.summary = summary;
        refs.clear = clear;
        refs.itemToggle = itemToggle;

        fillSelect(general, "Todas as áreas gerais", uniqueOptions(records, "generalKey", "generalLabel"), "");
        rebuildDependentFilters();

        search.addEventListener("input", function () {
          window.clearTimeout(searchTimer);
          searchTimer = window.setTimeout(applyFilters, 70);
        });
        search.addEventListener("keydown", function (event) {
          if (event.key === "Escape" && search.value) {
            event.preventDefault();
            search.value = "";
            applyFilters();
          }
        });
        general.addEventListener("change", function () {
          specific.value = "";
          detailed.value = "";
          rebuildDependentFilters();
          applyFilters();
        });
        specific.addEventListener("change", function () {
          detailed.value = "";
          rebuildDependentFilters();
          applyFilters();
        });
        detailed.addEventListener("change", applyFilters);
        clear.addEventListener("click", clearFilters);
        itemToggle.addEventListener("click", function () {
          setAllItemsOpen(!itemsExpanded);
        });

        return toolbar;
      }

      function buildHeader(toolTitle, stats) {
        const header = createElement("header", "viewer-header");
        const row = createElement("div", "viewer-heading-row");
        const copy = createElement("div", "viewer-heading-copy");
        copy.appendChild(createElement("h1", "viewer-title", toolTitle));
        copy.appendChild(createElement(
          "p",
          "viewer-subtitle",
          "Áreas Gerais: " + stats.generals + " · Itens: " + stats.items +
          " · Documentos: " + stats.links
        ));

        const logos = createElement("div", "viewer-logos");
        logos.setAttribute("aria-label", "Logos institucionais");
        CONFIG.logos.forEach(function (logoData) {
          const slot = createElement("div", "logo-slot " + logoData.classe);
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("class", "viewer-logo");
          svg.setAttribute("viewBox", logoData.viewBox);
          svg.setAttribute("role", "img");
          svg.setAttribute("aria-label", logoData.textoAlternativo);
          svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

          if (logoData.tipo === "imagem" && logoData.imagem) {
            const image = document.createElementNS("http://www.w3.org/2000/svg", "image");
            image.setAttribute("x", "0");
            image.setAttribute("y", "0");
            image.setAttribute("width", String(logoData.largura));
            image.setAttribute("height", String(logoData.altura));
            image.setAttribute("preserveAspectRatio", "xMidYMid meet");
            image.setAttribute("href", logoData.imagem);
            image.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", logoData.imagem);
            svg.appendChild(image);
          } else if (logoData.conteudoSvg) {
            svg.innerHTML = logoData.conteudoSvg;
          } else {
            const image = document.createElementNS("http://www.w3.org/2000/svg", "image");
            image.setAttribute("x", "0");
            image.setAttribute("y", "0");
            image.setAttribute("width", String(logoData.largura));
            image.setAttribute("height", String(logoData.altura));
            image.setAttribute("preserveAspectRatio", "xMidYMid meet");
            image.setAttribute("href", logoData.imagem);
            svg.appendChild(image);
          }

          slot.appendChild(svg);
          logos.appendChild(slot);
        });

        row.appendChild(copy);
        row.appendChild(logos);
        header.appendChild(row);
        return header;
      }

      function calculateStats(root) {
        return {
          frames: root.querySelectorAll("quadros > quadro").length,
          generals: root.querySelectorAll("area_geral").length,
          items: root.querySelectorAll("item").length,
          links: root.querySelectorAll("link").length
        };
      }

      function renderRootExtras(root) {
        const extras = createElement("section", "root-extra");
        extras.appendChild(createElement("h2", "", "Informações adicionais"));
        appendUnknownChildren(root, new Set(["titulo", "metadados", "quadros"]), extras);
        return extras.childElementCount > 1 ? extras : null;
      }

      function renderDocument(xmlDocument) {
        const root = xmlDocument.documentElement;
        records = [];
        hierarchy = { frames: [], generals: [], specifics: [], detailed: [] };
        refs = {};
        itemsExpanded = false;

        const toolTitle = deriveToolTitle(root);
        const stats = calculateStats(root);
        document.title = toolTitle;
        app.replaceChildren();
        app.appendChild(buildHeader(toolTitle, stats));

        const content = createElement("section", "viewer-content");
        const rootExtras = renderRootExtras(root);
        if (rootExtras) {
          content.appendChild(rootExtras);
        }

        const framesWrapper = directChild(root, "quadros");
        const frameNodes = framesWrapper ? directChildren(framesWrapper, "quadro") : directChildren(root, "quadro");
        frameNodes.forEach(function (frameXml) {
          content.appendChild(renderFrame(frameXml));
        });

        if (framesWrapper) {
          appendUnknownChildren(framesWrapper, new Set(["quadro"]), content);
        }

        const empty = createElement(
          "div",
          "empty-results",
          "Nenhum item corresponde aos termos e filtros selecionados."
        );
        empty.hidden = true;
        content.appendChild(empty);
        refs.empty = empty;

        if (records.length === 0) {
          empty.hidden = false;
          empty.textContent = "O XML foi carregado, mas nenhum elemento <item> foi encontrado.";
        }

        const toolbar = buildToolbar();
        app.appendChild(toolbar);
        app.appendChild(content);

        const topButton = createElement("button", "back-to-top", "↑");
        topButton.type = "button";
        topButton.title = "Voltar ao início";
        topButton.setAttribute("aria-label", "Voltar ao início");
        topButton.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        app.appendChild(topButton);

        applyFilters();
      }

      function showLoadError(error) {
        app.replaceChildren();
        const status = createElement("section", "load-status");
        status.appendChild(createElement("h1", "", "Não foi possível carregar o XML"));
        status.appendChild(createElement("p", "", error.message || "Ocorreu um erro desconhecido."));
        status.appendChild(createElement(
          "p",
          "",
          "Confira se o arquivo quadro.xml está na mesma pasta do HTML no recurso do Moodle e se o nome do arquivo está correto."
        ));
        app.appendChild(status);
        console.error(error);
      }

      async function start() {
        try {
          const xmlText = await fetchXml();
          renderDocument(parseXml(xmlText));
        } catch (error) {
          showLoadError(error);
        }
      }

      start();
    })();
  </script>
</body>
